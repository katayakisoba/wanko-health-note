<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>わんこ健康ノート</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f2f7ec;
      color: #344437;
      margin: 0;
      padding: 20px;
    }
    main {
      max-width: 500px;
      margin: auto;
    }
    h1 { text-align: center; }
    section {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin: 16px 0;
    }
    label {
      display: block;
      margin-top: 14px;
      font-weight: bold;
    }
    input, select, textarea, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      background: #68a878;
      color: white;
      border: none;
      margin-top: 20px;
      font-weight: bold;
    }
    .record {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>🐶 わんこ健康ノート</h1>
    <p>愛犬の健康を毎日記録しよう！</p>

    <section>
      <h2>健康記録を入力</h2>
      <form id="healthForm">
        <label for="dog">犬の名前</label>
        <input id="dog" required>

        <label for="date">記録日</label>
        <input id="date" type="date" required>

        <label for="weight">体重（kg）</label>
        <input id="weight" type="number"
               step="0.1" min="0">

        <label for="appetite">食欲</label>
        <select id="appetite">
          <option>普通</option>
          <option>旺盛</option>
          <option>少ない</option>
          <option>食べない</option>
        </select>

        <label for="memo">メモ</label>
        <textarea id="memo" rows="3"></textarea>

        <button type="submit">記録を保存</button>
      </form>
    </section>

    <section>
      <h2>保存した記録</h2>
      <div id="records"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById("healthForm");
    const recordsDiv = document.getElementById("records");
    const saved = localStorage.getItem("wankoRecords");
    let records = [];

    try {
      records = saved ? JSON.parse(saved) : [];
      if (!Array.isArray(records)) records = [];
    } catch (error) {
      records = [];
    }

    document.getElementById("date").value =
      new Date().toLocaleDateString("sv-SE");

    function showRecords() {
      recordsDiv.textContent = "";

      if (records.length === 0) {
        recordsDiv.textContent = "まだ記録がありません。";
        return;
      }

      records.slice().reverse().forEach(function(r) {
        const div = document.createElement("div");
        div.className = "record";
        div.textContent =
          "🐾 " + r.dog + "\n" +
          "日付：" + r.date + "\n" +
          "体重：" + (r.weight || "未入力") + " kg\n" +
          "食欲：" + r.appetite + "\n" +
          "メモ：" + r.memo;
        recordsDiv.appendChild(div);
      });
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const record = {
        dog: document.getElementById("dog").value,
        date: document.getElementById("date").value,
        weight: document.getElementById("weight").value,
        appetite: document.getElementById("appetite").value,
        memo: document.getElementById("memo").value
      };

      records.push(record);
      localStorage.setItem("wankoRecords",
                           JSON.stringify(records));
      showRecords();
      alert("健康記録を保存しました！");
    });

    showRecords();
  </script>
</body>
</html>
